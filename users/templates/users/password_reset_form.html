{% extends "newsletters/base.html" %}

{% block title %}Сброс пароля{% endblock %}

{% block content %}
    <h1>Забыли пароль?</h1>
    <h5>Введите свой email для получения нового пароля:</h5>
    <form action="." method="post">
        {{ form.as_p }}
        <p><input type="submit" value="Отправить e-mail"></p>
        {% csrf_token %}
    </form>
{% endblock %}
