[tool.poetry]
name = "pythonproject1"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.6"
django-countries = "^7.6.1"
python-dotenv = "^1.0.1"
psycopg2-binary = "^2.9.10"
pillow = "^11.1.0"
black = "^25.1.0"
isort = "^6.0.1"
ipython = "^9.1.0"
redis = "^5.2.1"
django-redis = "^5.4.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.1"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untiped_defs = true
no_implicit_any = true
warn_return_any = true
exclude = "venv"
check_untyped_defs = true
warn_unreachable = true

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line_length = 119


