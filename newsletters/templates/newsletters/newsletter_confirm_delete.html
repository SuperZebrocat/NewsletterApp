{% extends 'newsletters/base.html' %}

{% block title %}Удаление рассылки{% endblock %}

{% block content %}
{% include 'newsletters/includes/inc_header.html' %}
<h2>Удаление рассылки "{{ newsletter.title }}"</h2>
<p>Подтверждение удаления рассылки</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'newsletters:newsletters_list' %}" class="btn btn-primary">Отменить</a>
</form>
{% endblock %}
