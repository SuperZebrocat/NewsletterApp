{% extends 'newsletters/base.html' %}

{% block title %}Форма для получателя рассылки{% endblock %}

{% block content %}
{% include 'newsletters/includes/inc_header.html' %}
<h2 class="mb-3">Форма получателя рассылки</h2>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary mt-3">Сохранить</button>
    <a href="{% url 'newsletters:clients_list' %}" class="btn btn-primary mt-3">Отменить</a>
</form>
{% endblock %}
