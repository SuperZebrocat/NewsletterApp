{% extends 'newsletters/base.html' %}

{% block title %}Форма для письма{% endblock %}

{% block content %}
{% include 'newsletters/includes/inc_header.html' %}
<h2 class="mb-3">Форма письма</h2>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'newsletters:messages_list' %}" class="btn btn-primary">Отменить</a>
</form>
{% endblock %}
