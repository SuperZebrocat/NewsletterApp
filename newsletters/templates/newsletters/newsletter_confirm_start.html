{% extends 'newsletters/base.html' %}

{% block title %}Подтверждение рассылки{% endblock %}

{% block content %}
{% include 'newsletters/includes/inc_header.html' %}
<h1 class="mb-5">Подтвердите отправку рассылки</h1>
    <form method="post" action="{% url 'newsletters:newsletter_confirm' newsletter.pk %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Отправить рассылку</button>
        <a href="{% url 'newsletters:newsletter_detail' newsletter.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
